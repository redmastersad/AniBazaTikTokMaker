<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AniBaza TikTok Studio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <img class="logo" id="sideLogo" alt="">
    <div class="tag">TIKTOK STUDIO</div>
    <div class="nav" data-s="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Новая нарезка<span class="b g" id="bQueue"></span></div>
    <div class="nav" data-s="style"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>Стиль и шрифты</div>
    <div class="nav" data-s="run"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Обработка<span class="b" id="bRun"></span></div>
    <div class="nav" data-s="clips"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M10 9l4 3-4 3z"/></svg>Готовые клипы<span class="b g" id="bClips"></span></div>
    <div class="nav" data-s="up"><svg viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>Публикация<span class="b" id="bUp"></span></div>
    <div class="nav" data-s="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Настройки</div>
    <div class="sys" id="sys"></div>
  </aside>

  <main class="main" id="s-new"></main>
  <main class="main" id="s-style"></main>
  <main class="main" id="s-run"></main>
  <main class="main" id="s-clips"></main>
  <main class="main" id="s-up"></main>
  <main class="main" id="s-settings"></main>
</div>

<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
